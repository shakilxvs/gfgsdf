name: TaskXVS Free WhatsApp Cloud Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *" # Every six hours at minute 17 UTC to avoid the top-of-hour queue.

concurrency:
  group: taskxvs-whatsapp-cloud-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  whatsapp-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      DATABASE_URL: ${{ secrets.TASKXVS_WHATSAPP_DATABASE_URL }}
      WHATSAPP_WORKER_MINUTES: "345"
    steps:
      - name: Check worker database secret
        id: config
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "TaskXVS WhatsApp worker is not configured yet. Add the repository Actions secret TASKXVS_WHATSAPP_DATABASE_URL."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out TaskXVS
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ""

      - name: Install worker dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm install --prefix whatsapp-worker --no-audit --no-fund

      - name: Run WhatsApp worker session
        if: steps.config.outputs.configured == 'true'
        working-directory: whatsapp-worker
        run: node worker.js
